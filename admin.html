<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>SymbolHub - 心愿单管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
      min-height: 100vh;
    }
    .header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #0ABAB5;
    }
    .header .back {
      color: #6b7280;
      text-decoration: none;
      font-size: 14px;
    }
    .header .back:hover { color: #0ABAB5; }
    .container { max-width: 960px; margin: 0 auto; padding: 24px; }
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px 18px;
      flex: 1;
      text-align: center;
    }
    .stat-card .num { font-size: 24px; font-weight: 700; color: #0ABAB5; }
    .stat-card .label { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      background: #fff;
      border-radius: 8px;
      padding: 4px;
      border: 1px solid #e5e7eb;
      overflow-x: auto;
    }
    .tab {
      padding: 8px 16px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #6b7280;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab:hover { background: #f3f4f6; }
    .tab.active { background: #0ABAB5; color: #fff; }
    .table-wrap {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: #f9fafb;
      padding: 10px 14px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #e5e7eb;
    }
    td {
      padding: 10px 14px;
      font-size: 13px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fafb; }
    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-ignored { background: #e5e7eb; color: #6b7280; }
    .status-rejected { background: #fee2e2; color: #991b1b; }
    .status-accepted { background: #d1fae5; color: #065f46; }
    .actions { display: flex; gap: 6px; }
    .action-btn {
      padding: 4px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: #0ABAB5; color: #0ABAB5; }
    .action-btn--accept:hover { background: #d1fae5; border-color: #059669; color: #059669; }
    .action-btn--reject:hover { background: #fee2e2; border-color: #dc2626; color: #dc2626; }
    .action-btn--ignore:hover { background: #e5e7eb; border-color: #9ca3af; color: #6b7280; }
    .empty {
      text-align: center;
      padding: 40px;
      color: #9ca3af;
      font-size: 14px;
    }
    .time { color: #9ca3af; font-size: 12px; }
    .email { color: #6b7280; }
    .loading { text-align: center; padding: 40px; color: #9ca3af; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <a href="./" class="back">&larr; 返回 SymbolHub</a>
      <h1>💌 心愿单管理</h1>
    </div>
    <div class="container">
      <div class="stats">
        <div class="stat-card">
          <div class="num">{{ total }}</div>
          <div class="label">总计</div>
        </div>
        <div class="stat-card">
          <div class="num">{{ pendingCount }}</div>
          <div class="label">待处理</div>
        </div>
        <div class="stat-card">
          <div class="num">{{ acceptedCount }}</div>
          <div class="label">已接受</div>
        </div>
        <div class="stat-card">
          <div class="num">{{ rejectedCount }}</div>
          <div class="label">已拒绝</div>
        </div>
      </div>

      <div class="tabs">
        <button
          v-for="tab in tabs"
          :key="tab.key"
          class="tab"
          :class="{ active: activeTab === tab.key }"
          @click="activeTab = tab.key"
        >
          {{ tab.label }} ({{ tab.count }})
        </button>
      </div>

      <div v-if="loading" class="loading">加载中...</div>

      <div v-else class="table-wrap">
        <table v-if="filteredList.length">
          <thead>
            <tr>
              <th>符号描述</th>
              <th>邮箱</th>
              <th>提交时间</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="item in filteredList" :key="item.id">
              <td>{{ item.symbolDesc }}</td>
              <td class="email">{{ item.email || '-' }}</td>
              <td class="time">{{ formatTime(item.createdAt) }}</td>
              <td>
                <span class="status" :class="'status-' + item.status">
                  {{ statusLabel[item.status] }}
                </span>
              </td>
              <td>
                <div class="actions">
                  <button
                    v-if="item.status !== 'accepted'"
                    class="action-btn action-btn--accept"
                    @click="updateStatus(item.id, 'accepted')"
                  >接受</button>
                  <button
                    v-if="item.status !== 'rejected'"
                    class="action-btn action-btn--reject"
                    @click="updateStatus(item.id, 'rejected')"
                  >拒绝</button>
                  <button
                    v-if="item.status !== 'ignored'"
                    class="action-btn action-btn--ignore"
                    @click="updateStatus(item.id, 'ignored')"
                  >忽略</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">暂无心愿单数据</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const API_BASE = './api/wishlist.php'
    const TOKEN_KEY = 'symbolhub-admin-token'

    const { createApp, ref, computed, onMounted } = Vue

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || ''
    }

    // Attach the admin token; prompt once and retry on 401.
    async function authFetch(url, options) {
      const opts = Object.assign({}, options)
      opts.headers = Object.assign({ 'X-Auth-Token': getToken() }, opts.headers || {})
      let res = await fetch(url, opts)
      if (res.status === 401) {
        const entered = window.prompt('请输入管理 Token：')
        if (entered && entered.trim()) {
          localStorage.setItem(TOKEN_KEY, entered.trim())
          opts.headers['X-Auth-Token'] = entered.trim()
          res = await fetch(url, opts)
        }
      }
      return res
    }

    createApp({
      setup() {
        const list = ref([])
        const loading = ref(true)
        const activeTab = ref('all')

        const statusLabel = { pending: '待处理', ignored: '已忽略', rejected: '已拒绝', accepted: '已接受' }

        async function fetchList() {
          loading.value = true
          try {
            const res = await authFetch(API_BASE)
            const result = await res.json()
            if (result.success) list.value = result.data
          } catch (e) {
            console.error('Failed to load wishlist:', e)
          } finally {
            loading.value = false
          }
        }

        async function updateStatus(id, status) {
          try {
            const res = await authFetch(API_BASE, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id, status })
            })
            const result = await res.json()
            if (result.success) {
              const item = list.value.find(i => i.id === id)
              if (item) item.status = status
            }
          } catch (e) {
            console.error('Failed to update:', e)
          }
        }

        onMounted(fetchList)

        const total = computed(() => list.value.length)
        const pendingCount = computed(() => list.value.filter(i => i.status === 'pending').length)
        const acceptedCount = computed(() => list.value.filter(i => i.status === 'accepted').length)
        const rejectedCount = computed(() => list.value.filter(i => i.status === 'rejected').length)
        const ignoredCount = computed(() => list.value.filter(i => i.status === 'ignored').length)

        const tabs = computed(() => [
          { key: 'all', label: '全部', count: total.value },
          { key: 'pending', label: '待处理', count: pendingCount.value },
          { key: 'accepted', label: '已接受', count: acceptedCount.value },
          { key: 'rejected', label: '已拒绝', count: rejectedCount.value },
          { key: 'ignored', label: '已忽略', count: ignoredCount.value }
        ])

        const filteredList = computed(() => {
          if (activeTab.value === 'all') return list.value
          return list.value.filter(i => i.status === activeTab.value)
        })

        function formatTime(iso) {
          if (!iso) return '-'
          const d = new Date(iso)
          return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
        }

        return { list, loading, activeTab, tabs, filteredList, total, pendingCount, acceptedCount, rejectedCount, statusLabel, updateStatus, formatTime }
      }
    }).mount('#app')
  </script>
</body>
</html>
